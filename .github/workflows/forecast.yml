name: Sales forecast

on:
  schedule:
    - cron: "0 18 * * *"   # nightly full forecast at 2:00 AM Philippine time
    - cron: "15 * * * *"   # hourly check for a queued "Regenerate Forecast" request
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

concurrency:
  group: sales-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/forecasting/requirements.txt

      - name: Install libraries
        run: pip install -r services/forecasting/requirements.txt

      - name: Run forecast
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            python services/forecasting/forecast.py --queued-only
          else
            python services/forecasting/forecast.py
          fi